name: Build Windows (Internal)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tag_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Check version before packaging
        run: node pipeline/.github/scripts/release-plan.cjs version source/apps/desktop/package.json
      - name: Install workspace dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Build desktop
        working-directory: source
        run: npm run build -w @whale/desktop
      - name: Package Windows zip and installer (no publication)
        working-directory: source/apps/desktop
        run: npx electron-builder --win --publish never
      - name: Record source and artifact checksums
        run: node pipeline/.github/scripts/release-plan.cjs manifest windows source/apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ inputs.source_sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            source/apps/desktop/release/*.zip
            source/apps/desktop/release/*.exe
            source/apps/desktop/release/release-manifest.json
