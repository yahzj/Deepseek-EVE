name: Publish (Manual)
run-name: Publish ${{ inputs.target }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: '发布平台'
        required: true
        type: choice
        options: [web, windows, both]
      source_ref:
        description: '已合入默认分支的提交SHA、分支或标签；解析后锁定SHA'
        required: true
        default: main
        type: string
      tag_name:
        description: 'Windows必填：已推送且指向相同提交的v版本标签'
        required: false
        type: string

permissions:
  contents: read

# 不打断运行中的发布；GitHub可能替换较早的pending任务，不是无限队列。
concurrency:
  group: production-publish
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      web: ${{ steps.plan.outputs.web }}
      windows: ${{ steps.plan.outputs.windows }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
    steps:
      - name: Require the default-branch workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve and validate publication plan
        id: plan
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release-plan.cjs resolve
      - uses: actions/upload-artifact@v4
        with:
          name: publication-plan
          path: publication-plan.json
          if-no-files-found: error
          retention-days: 30

  checks:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install validation dependencies without desktop downloads
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run l10n:check
      - run: npm run l10n:params
      - run: npm run ui:rot-check
      - name: Full core release regression
        run: npm run test -w @whale/core

  build-web:
    needs: [resolve, checks]
    if: needs.resolve.outputs.web == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  build-windows:
    needs: [resolve, checks]
    if: needs.resolve.outputs.windows == 'true'
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      tag_name: ${{ needs.resolve.outputs.tag_name }}

  ready:
    needs: [resolve, checks, build-web, build-windows]
    if: >-
      ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.checks.result == 'success' &&
      ((needs.resolve.outputs.web == 'true' && needs['build-web'].result == 'success') ||
      (needs.resolve.outputs.web == 'false' && needs['build-web'].result == 'skipped')) &&
      ((needs.resolve.outputs.windows == 'true' && needs['build-windows'].result == 'success') ||
      (needs.resolve.outputs.windows == 'false' && needs['build-windows'].result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: All selected builds passed
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: printf 'Ready to publish %s\n' "$SOURCE_SHA"
      - name: Check Windows tag and release before either platform goes live
        if: needs.resolve.outputs.windows == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let object = (await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.RELEASE_TAG}` })).data.object;
            for (let i = 0; object.type === 'tag' && i < 10; i++) {
              object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.RELEASE_SHA) throw new Error('标签已移动，所选平台均不上线');
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            if (releases.some(release => release.tag_name === process.env.RELEASE_TAG)) {
              throw new Error('同名Release或草稿已存在，所选平台均不上线；请先检查已有发布');
            }

  publish-web:
    needs: [resolve, ready]
    if: ${{ always() && !cancelled() && needs.ready.result == 'success' && needs.resolve.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-windows:
    needs: [resolve, ready]
    if: ${{ always() && !cancelled() && needs.ready.result == 'success' && needs.resolve.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ needs.resolve.outputs.source_sha }}
          path: windows-release
      - name: Verify downloaded artifact provenance and checksums
        run: node .github/scripts/release-plan.cjs verify windows-release
      - name: Refuse moved tags and existing releases or drafts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let object = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object;
            for (let i = 0; object.type === 'tag' && i < 10; i++) {
              object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.RELEASE_SHA) {
              throw new Error('版本标签已移动，拒绝发布与构建不同的提交');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            if (releases.some(release => release.tag_name === tag)) {
              throw new Error('同名Release或草稿已存在，请先检查，不自动覆盖或删除');
            }
      - name: Upload all assets to a draft
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          name: ${{ needs.resolve.outputs.tag_name }}
          target_commitish: ${{ needs.resolve.outputs.source_sha }}
          generate_release_notes: true
          body: 'Source commit: ${{ needs.resolve.outputs.source_sha }}. Checksums: release-manifest.json.'
          draft: true
          fail_on_unmatched_files: true
          files: |
            windows-release/*.zip
            windows-release/*.exe
            windows-release/release-manifest.json
      - name: Publish after complete upload and recheck the tag
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(release_id) || release_id <= 0) throw new Error('无效的Release ID');
            let object = (await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.RELEASE_TAG}` })).data.object;
            for (let i = 0; object.type === 'tag' && i < 10; i++) {
              object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.RELEASE_SHA) throw new Error('标签已移动，保留草稿不上线');
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });

  summary:
    needs: [resolve, checks, build-web, build-windows, ready, publish-web, publish-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.RESULTS);
            await core.summary.addHeading('Publication Results')
              .addRaw(`Source SHA: ${jobs.resolve.outputs?.source_sha || 'unresolved'}\n\n`)
              .addTable([['Job', 'Result'], ...Object.entries(jobs).map(([name, job]) => [name, job.result])])
              .addRaw('\n网页和Windows不是原子发布；部分失败时先检查已上线平台，不要直接重发两端。\n')
              .write();
