<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232b6fe0%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27%3E%E9%B2%B8%3C/text%3E%3C/svg%3E" />
    <title>大鲸鱼 · 服务端调试台</title>
    <style>
      :root { color-scheme: light; --line: #d8dde6; --ink: #1b2330; --muted: #5f6b7d; --bg: #f6f8fb; --card: #fff; --accent: #1f6feb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
      h1 { font-size: 18px; margin: 0 0 4px; }
      h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
      input, select, textarea, button { font: inherit; }
      input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
      textarea { min-height: 70px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      button { padding: 6px 12px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer; }
      button.ghost { background: #fff; color: var(--accent); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
      .row > * { flex: 1 1 120px; }
      .row > button { flex: 0 0 auto; }
      pre { margin: 8px 0 0; padding: 8px; background: #0f172a; color: #d7e2f0; border-radius: 6px; max-height: 220px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
      .log { max-height: 180px; }
      .tag { display: inline-block; padding: 1px 6px; border-radius: 999px; background: #e8eefc; color: var(--accent); font-size: 12px; margin-left: 6px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
      .muted { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>大鲸鱼 · 服务端调试台 <span class="tag" id="conn">未连接</span></h1>
    <p class="muted">
      <a href="./" style="color:#1f6feb">← 返回客户端</a> ·
      这是接口级联调页，不参与游戏构建。地址栏带 <code>?server=http://1.2.3.4:8787</code> 可预填服务器地址；
      日常使用请走客户端页面。
    </p>

    <div class="grid">
      <section>
        <h2>1. 服务器与账号</h2>
        <label>服务器地址</label>
        <div class="row">
          <input id="server" placeholder="http://127.0.0.1:8787" />
          <button id="ping" class="ghost">测试连接</button>
        </div>
        <label>设备码（客户端自动生成，存本地）</label>
        <div class="row">
          <input id="device" />
          <button id="regen" class="ghost">重生成</button>
        </div>
        <label>昵称</label>
        <input id="nickname" placeholder="船长名" />
        <div class="row" style="margin-top: 8px">
          <button id="register">注册 / 登录</button>
          <button id="recovery" class="ghost">重新签发恢复码</button>
        </div>
        <pre id="accountOut">未登录</pre>
      </section>

      <section>
        <h2>2. 云存档</h2>
        <label>存档 JSON（可粘贴，也可从文件读入）</label>
        <textarea id="saveText" placeholder='{"example": true}'></textarea>
        <div class="row" style="margin-top: 8px">
          <input id="saveFile" type="file" accept=".json,application/json" />
          <button id="upload">上传存档</button>
          <button id="download" class="ghost">下载最新</button>
          <button id="versions" class="ghost">版本列表</button>
        </div>
        <pre id="saveOut">-</pre>
      </section>

      <section>
        <h2>3. 聊天（3 秒打包）</h2>
        <div class="row">
          <select id="channel">
            <option value="zh">中文频道</option>
            <option value="en">English</option>
          </select>
          <button id="chatConnect">连接</button>
          <button id="chatDisconnect" class="ghost">断开</button>
        </div>
        <label>消息（回车发送，3 秒内多条会打成一个帧）</label>
        <div class="row">
          <input id="chatInput" placeholder="说点什么…" />
          <button id="chatSend">发送</button>
        </div>
        <pre id="chatOut" class="log">未连接</pre>
      </section>

      <section>
        <h2>4. 钱包 / 库存 / 市场</h2>
        <div class="row">
          <button id="wallet" class="ghost">钱包</button>
          <button id="inventory" class="ghost">库存</button>
          <button id="myOrders" class="ghost">我的订单</button>
          <button id="verify" class="ghost">校验账本</button>
        </div>
        <label>物品搜索（名称或 id）</label>
        <div class="row">
          <input id="itemQuery" placeholder="veldspar" />
          <button id="search">查询目录</button>
        </div>
        <div id="catalog" class="muted">-</div>
        <pre id="marketOut">-</pre>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = { server: '', token: '', ws: null, queue: [], timer: null };

      const randomDevice = () => {
        const rand = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
        return `dev-${rand(8)}${Date.now().toString(36)}`;
      };

      function persist() {
        localStorage.setItem('whale.debug', JSON.stringify({
          server: state.server,
          device: $('device').value,
          nickname: $('nickname').value,
          token: state.token,
        }));
      }

      function restore() {
        const param = new URLSearchParams(location.search).get('server');
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem('whale.debug') || '{}'); } catch {}
        $('server').value = param || saved.server || location.origin;
        $('device').value = saved.device || randomDevice();
        $('nickname').value = saved.nickname || '';
        state.token = saved.token || '';
        state.server = $('server').value;
        if (state.token) $('accountOut').textContent = `已登录（token 已保存）\n${state.token}`;
      }

      function api(path, options = {}) {
        const base = ($('server').value || location.origin).replace(/\/$/, '');
        return fetch(base + path, {
          ...options,
          headers: {
            'content-type': 'application/json',
            ...(state.token ? { authorization: `Bearer ${state.token}` } : {}),
            ...(options.headers || {}),
          },
        }).then(async (res) => {
          const text = await res.text();
          let body;
          try { body = JSON.parse(text); } catch { body = text; }
          if (!res.ok) throw new Error(`${res.status} ${typeof body === 'string' ? body : JSON.stringify(body)}`);
          return body;
        });
      }

      function show(id, data) {
        $(id).textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      }

      $('ping').onclick = async () => {
        try {
          const health = await api('/health');
          $('conn').textContent = `在线 ${health.time}`;
          $('conn').style.background = '#e6f4ea';
          $('conn').style.color = '#137333';
          show('accountOut', health);
        } catch (e) {
          $('conn').textContent = '连接失败';
          $('conn').style.background = '#fce8e6';
          $('conn').style.color = '#c5221f';
          show('accountOut', String(e));
        }
      };

      $('regen').onclick = () => { $('device').value = randomDevice(); persist(); };

      $('register').onclick = async () => {
        try {
          const body = await api('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({ deviceCode: $('device').value, nickname: $('nickname').value || '无名船长' }),
          });
          state.token = body.token;
          persist();
          show('accountOut', { playerId: body.playerId, nickname: body.nickname, token: body.token, 恢复码: body.recoveryCode || '（登录不返回，需重新签发）' });
        } catch (e) { show('accountOut', String(e)); }
      };

      $('recovery').onclick = async () => {
        try { show('accountOut', await api('/api/auth/recovery/rotate', { method: 'POST', body: '{}' })); }
        catch (e) { show('accountOut', String(e)); }
      };

      $('saveFile').onchange = async (event) => {
        const file = event.target.files[0];
        if (file) $('saveText').value = await file.text();
      };

      $('upload').onclick = async () => {
        try { show('saveOut', await api('/api/saves', { method: 'PUT', body: JSON.stringify({ data: $('saveText').value }) })); }
        catch (e) { show('saveOut', String(e)); }
      };

      $('download').onclick = async () => {
        try {
          const body = await api('/api/saves/latest');
          show('saveOut', { version: body.version, size: body.size });
          if (body.data) $('saveText').value = body.data;
        } catch (e) { show('saveOut', String(e)); }
      };

      $('versions').onclick = async () => {
        try { show('saveOut', await api('/api/saves/versions')); }
        catch (e) { show('saveOut', String(e)); }
      };

      const chatLog = (line) => {
        const el = $('chatOut');
        if (el.textContent === '未连接') el.textContent = '';
        el.textContent += line + '\n';
        el.scrollTop = el.scrollHeight;
      };

      const flushChat = () => {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN || state.queue.length === 0) return;
        state.ws.send(JSON.stringify({ type: 'batch', channel: $('channel').value, messages: state.queue.splice(0, 5) }));
        if (state.queue.length > 0) setTimeout(flushChat, 3000);
      };

      $('chatConnect').onclick = () => {
        if (!state.token) { chatLog('请先注册/登录'); return; }
        const base = ($('server').value || location.origin).replace(/^http/, 'ws').replace(/\/$/, '');
        state.ws = new WebSocket(`${base}/api/chat/ws?token=${state.token}`);
        state.ws.onopen = () => { chatLog('— 已连接 —'); $('chatOut').textContent = $('chatOut').textContent.replace('未连接\n', ''); };
        state.ws.onclose = () => chatLog('— 连接关闭 —');
        state.ws.onerror = () => chatLog('— 连接错误 —');
        state.ws.onmessage = (event) => {
          const frame = JSON.parse(event.data);
          if (frame.type === 'hello') chatLog(`欢迎 ${frame.nickname}，在线 ${frame.online.length} 人`);
          else if (frame.type === 'presence') chatLog(`* ${frame.nickname} ${frame.event === 'join' ? '上线' : '下线'}（在线 ${frame.onlineCount}）`);
          else if (frame.type === 'batch') chatLog(`[${frame.channel}] ${frame.nickname}: ${frame.messages.join(' / ')}`);
          else if (frame.type === 'error') chatLog(`! ${frame.code} ${frame.message}`);
        };
      };

      $('chatDisconnect').onclick = () => { state.ws && state.ws.close(); state.ws = null; };

      const sendChat = () => {
        const text = $('chatInput').value.trim();
        if (!text) return;
        $('chatInput').value = '';
        state.queue.push(text);
        if (!state.timer) {
          state.timer = setTimeout(() => { state.timer = null; flushChat(); }, 3000);
        }
      };
      $('chatSend').onclick = sendChat;
      $('chatInput').onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };

      $('wallet').onclick = async () => {
        try { show('marketOut', await api('/api/wallet')); } catch (e) { show('marketOut', String(e)); }
      };
      $('inventory').onclick = async () => {
        try { show('marketOut', await api('/api/inventory')); } catch (e) { show('marketOut', String(e)); }
      };
      $('myOrders').onclick = async () => {
        try { show('marketOut', await api('/api/market/orders/mine')); } catch (e) { show('marketOut', String(e)); }
      };
      $('verify').onclick = async () => {
        try { show('marketOut', await api('/api/ledger/verify')); } catch (e) { show('marketOut', String(e)); }
      };

      $('search').onclick = async () => {
        try {
          const body = await api('/api/market/catalog?q=' + encodeURIComponent($('itemQuery').value));
          const rows = body.items.slice(0, 20).map((item) =>
            `<tr><td>${item.name}</td><td>${item.itemDefId}</td><td>${item.basePrice}</td><td>${item.floorPrice}</td><td>${item.instanceBased ? '实例' : '堆叠'}</td></tr>`).join('');
          $('catalog').innerHTML = `<table><thead><tr><th>名称</th><th>id</th><th>基准价</th><th>最低价</th><th>类型</th></tr></thead><tbody>${rows}</tbody></table><p class="muted">共 ${body.total} 条，显示前 20</p>`;
        } catch (e) { $('catalog').textContent = String(e); }
      };

      restore();
    </script>
  </body>
</html>
