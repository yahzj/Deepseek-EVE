<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 掠食者武装族 草稿批 4/4：梭鱼级无人机护卫(机库条 + 前甲板放飞口 + 快艇身) -->
  <defs><style>
    .sky { fill:#0b1016 }.star { fill:#dfe9f2; opacity:.5 }
    .hull { fill:none; stroke:#dfe9f2; stroke-width:2.2; stroke-linejoin:round }
    .panel { fill:none; stroke:#dfe9f2; stroke-width:1; opacity:.4 }
    .acc  { fill:none; stroke:#ff8373; stroke-width:1.6 }
    .accf { fill:#ff8373 }.warm { fill:#ffd98a }
    .note { fill:#8aa0b8; font: 11px monospace }
  </style></defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="46" cy="44" r="1.2"/><circle class="star" cx="516" cy="60" r="1"/><circle class="star" cx="478" cy="236" r="1.2"/><circle class="star" cx="64" cy="254" r="1"/><circle class="star" cx="286" cy="34" r="1"/>
  <g transform="translate(40 74) scale(2.2)">
    <path class="warm" d="M24 52 L14 55 L24 58 Z" opacity=".9"/>
    <!-- 快艇式细身（中段有上层机库平台） -->
    <path class="hull" d="M210 56 L176 42 L150 42 L88 42 C70 42 58 46 50 52 L44 56 L50 60 C58 66 72 70 92 70 L150 70 Z"/>
    <!-- 机库上层建筑（平板 + 格口,梭鱼核心特征） -->
    <path class="hull" d="M92 42 h60 v7 h-60 z"/>
    <path class="panel" d="M98 43 v5 M106 43 v5 M114 43 v5 M122 43 v5 M130 43 v5 M138 43 v5 M146 43 v5"/>
    <!-- 前甲板放飞口（斜格 ×2） -->
    <path class="hull" d="M158 45 l10 6 v-8 z M176 45 l10 6 v-8 z" opacity=".85"/>
    <!-- 上后掠尾翼 / 下尾翼 -->
    <path class="hull" d="M104 42 L126 26 L134 26 L114 42"/>
    <path class="hull" d="M104 70 L126 86 L134 86 L114 70"/>
    <!-- 尾部指挥塔 -->
    <path class="hull" d="M168 34 h11 v8 h-11 z"/>
    <path class="panel" d="M170 36 h7"/>
    <!-- 双引擎口 -->
    <path class="hull" d="M46 44 h9 v11 h-9 z M46 59 h9 v11 h-9 z" opacity=".85"/>
    <path class="warm" d="M36 46 h8 v7 h-8 z M36 61 h8 v7 h-8 z"/>
    <!-- 甲板导流线 -->
    <path class="panel" d="M98 55 h44 M98 62 h44"/>
    <circle class="accf" cx="156" cy="56" r="1.3"/>
    <circle class="warm" cx="94" cy="38" r="1"/>
  </g>
  <text class="note" x="40" y="286">梭鱼级无人机护卫 · sh-swarm · 驱逐 T2·无人机型 — 草稿(机库格口 + 前甲板放飞口 + 快艇身)</text>
</svg>
