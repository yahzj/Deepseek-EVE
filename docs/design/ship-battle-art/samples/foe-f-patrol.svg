<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 敌舰族群 F：遭遇巡逻舰(低安遭遇 enc 系列:制式规整 + 灯条,暗红涂装;档次随 threat 变细节) -->
  <defs><style>
    .sky { fill:#0b1016 }.star { fill:#dfe9f2; opacity:.5 }
    .hull { fill:none; stroke:#e0c8c0; stroke-width:2.2; stroke-linejoin:round }
    .panel { fill:none; stroke:#e0c8c0; stroke-width:1; opacity:.4 }
    .acc  { fill:none; stroke:#ff6b52; stroke-width:1.6 }
    .accf { fill:#ff6b52 }.warm { fill:#ffb46b }
    .note { fill:#8aa0b8; font: 11px monospace }
  </style></defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="52" cy="48" r="1.2"/><circle class="star" cx="510" cy="62" r="1"/><circle class="star" cx="478" cy="238" r="1.2"/><circle class="star" cx="64" cy="252" r="1"/>
  <g transform="translate(40 74) scale(2.2)">
    <path class="warm" d="M34 55 L24 58 L34 61 Z" opacity=".9"/>
    <!-- 制式巡逻舰:规整尖首巡逻体（统一制式语言,可作 4 档缩放母型） -->
    <path class="hull" d="M206 55 L180 40 L112 40 C92 40 76 45 66 51 L56 56 L62 64 C72 71 92 75 116 75 L168 73 Z"/>
    <!-- 舷侧灯条（巡逻识别:一条亮线） -->
    <path class="acc" d="M92 55 h48" stroke-width="2"/>
    <!-- 制式舰桥（中置） -->
    <path class="hull" d="M150 40 h15 v9 h-15 z"/>
    <path class="panel" d="M153 43 h9"/>
    <!-- 前炮（单管制式 + 侧双小） -->
    <path class="hull" d="M206 52 L222 52 L222 56 L206 58 Z"/>
    <path class="hull" d="M104 60 h7 v4 h-7 z M111 60 v6"/>
    <path class="hull" d="M128 62 h6 v4 h-6 z M134 62 v5"/>
    <!-- 面板线（规整分舱） -->
    <path class="panel" d="M96 46 h40 M96 62 h40 M138 42 v28"/>
    <!-- 双引擎 -->
    <path class="hull" d="M62 44 h8 v13 h-8 z M62 61 h8 v13 h-8 z" opacity=".85"/>
    <path class="warm" d="M52 47 h8 v7 h-8 z M52 64 h8 v7 h-8 z"/>
    <circle class="accf" cx="118" cy="78" r="1.3"/>
  </g>
  <text class="note" x="40" y="286">敌族 F：遭遇巡逻舰(低安遭遇 enc 四档通用母型)— 草稿(制式规整 + 舷灯条,threat 档 = 尺寸/细节分级)</text>
</svg>
