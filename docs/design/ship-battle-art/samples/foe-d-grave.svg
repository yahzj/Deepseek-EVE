<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 敌舰族群 D：守墓古舰队(坟场/虚海/穹顶/幽灵:残破古典长舰 + 磷光青冷点) -->
  <defs><style>
    .sky { fill:#0b1016 }.star { fill:#dfe9f2; opacity:.5 }
    .hull { fill:none; stroke:#c8d8e8; stroke-width:2.2; stroke-linejoin:round }
    .panel { fill:none; stroke:#c8d8e8; stroke-width:1; opacity:.4 }
    .ghost { fill:none; stroke:#8fc7ff; stroke-width:1.5; opacity:.9 }
    .ghostf { fill:#8fc7ff }
    .note { fill:#8aa0b8; font: 11px monospace }
  </style></defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="52" cy="46" r="1.2"/><circle class="star" cx="510" cy="64" r="1"/><circle class="star" cx="478" cy="238" r="1.2"/><circle class="star" cx="64" cy="252" r="1"/>
  <g transform="translate(40 74) scale(2.2)">
    <path class="warm" d="M30 55 L20 58 L30 61 Z" opacity=".6"/>
    <!-- 古典长舰（古式纵帆舰轮廓:长身 + 高舷弧 + 楼艉） -->
    <path class="hull" d="M210 58 C206 44 178 36 138 36 C100 36 76 44 64 54 L56 60 L68 66 C84 72 108 75 136 74 L184 72 Z"/>
    <!-- 楼艉塔（守墓古舰的高艉楼 = 特征） -->
    <path class="hull" d="M84 40 h20 v20 h-20 z M88 44 h12"/>
    <!-- 破旧帆桁残杆 -->
    <path class="hull" d="M120 36 V18 M142 36 V14 M166 36 V20"/>
    <path class="ghost" d="M120 24 l6 4 l-6 4 M142 20 l6 4 l-6 4" opacity=".8"/>
    <!-- 磷光符文点（冷青 = 幽灵能量） -->
    <circle class="ghostf" cx="150" cy="30" r="1.3"/>
    <circle class="ghostf" cx="176" cy="36" r="1.2"/>
    <path class="ghost" d="M200 50 c4 2 4 6 0 8" opacity=".7"/>
    <!-- 前主炮（古炮:细长单管） -->
    <path class="hull" d="M210 54 L230 52 L230 56 L210 60 Z"/>
    <!-- 舷排桨孔线（古桨位:装饰性孔列） -->
    <path class="panel" d="M96 68 h8 v3 M110 69 h8 v3 M124 70 h8 v3 M138 70 h8 v3" opacity=".6"/>
    <!-- 残破面板（战损补丁） -->
    <path class="panel" d="M130 42 l12 26 M150 40 l8 26" stroke-dasharray="4 3"/>
    <!-- 双引擎（古典外包,弱光） -->
    <path class="hull" d="M58 44 h8 v12 h-8 z M58 60 h8 v12 h-8 z" opacity=".8"/>
    <path class="ghost" d="M48 46 h8 v8 h-8 z M48 62 h8 v8 h-8 z" fill="none"/>
  </g>
  <text class="note" x="40" y="286">敌族 D：守墓古舰队(坟场·虚海·穹顶·幽灵类)— 草稿(古典长舰 + 高艉楼 + 残杆 + 磷光青点)</text>
</svg>
