<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 掠食者武装族 草稿批 1/4：马鲛级护卫舰(制式护卫,双引擎 + 中置脊炮) -->
  <defs><style>
    .sky { fill:#0b1016 }.star { fill:#dfe9f2; opacity:.5 }
    .hull { fill:none; stroke:#dfe9f2; stroke-width:2.2; stroke-linejoin:round }
    .panel { fill:none; stroke:#dfe9f2; stroke-width:1; opacity:.4 }
    .acc  { fill:none; stroke:#ff8373; stroke-width:1.6 }
    .accf { fill:#ff8373 }.warm { fill:#ffd98a }
    .note { fill:#8aa0b8; font: 11px monospace }
  </style></defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="50" cy="44" r="1.2"/><circle class="star" cx="514" cy="60" r="1"/><circle class="star" cx="480" cy="236" r="1.2"/><circle class="star" cx="70" cy="252" r="1"/><circle class="star" cx="270" cy="32" r="1"/>
  <g transform="translate(40 74) scale(2.2)">
    <path class="warm" d="M22 52 L12 55 L22 58 Z" opacity=".9"/>
    <!-- 主舰体：长菱形制式护卫身 -->
    <path class="hull" d="M206 55 L168 40 L96 40 C76 40 60 44 50 50 L44 56 L50 62 C62 69 78 72 98 72 L150 72 Z"/>
    <!-- 上后掠尾翼 -->
    <path class="hull" d="M100 40 L130 22 L140 22 L118 40"/>
    <!-- 下后掠尾翼 -->
    <path class="hull" d="M100 72 L130 90 L140 90 L118 72"/>
    <!-- 中置脊炮塔 + 炮管 -->
    <path class="hull" d="M146 41 h13 v9 h-13 z"/>
    <path class="hull" d="M159 43 L190 44" stroke-width="2.6"/>
    <path class="acc" d="M190 44 L195 44" stroke-width="1.8"/>
    <!-- 机头鼻炮（短） -->
    <path class="hull" d="M206 55 L222 56 L222 60 L206 62 Z"/>
    <!-- 双引擎口（上下小喷口并排） -->
    <path class="hull" d="M46 44 h9 v12 h-9 z M46 58 h9 v12 h-9 z" opacity=".85"/>
    <path class="warm" d="M36 46 h8 v8 h-8 z M36 60 h8 v8 h-8 z"/>
    <!-- 制式舰桥窗列 -->
    <path class="panel" d="M158 48 h18 v7 h-18 z M160 49.5 h14 M160 53 h14"/>
    <!-- 船身面板线 + 维修口 -->
    <path class="panel" d="M96 46 h34 M96 66 h34 M132 46 v18 M70 52 h14"/>
    <path class="panel" d="M70 60 h14"/>
    <circle class="accf" cx="88" cy="56" r="1.4"/>
  </g>
  <text class="note" x="40" y="286">马鲛级护卫舰 · sh-shrike · 护卫 T1 — 草稿(制式护卫:双引擎 + 中置脊炮 + 鼻炮)</text>
</svg>
