<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 样稿 2/4：灰鲭鲨级驱逐舰（掠食者武装 · 标准驱逐舰，玩家最熟的主力）
       风格基线：线稿 + 内部面板线 + 色点缀；船头朝右；双引擎口左端 -->
  <defs>
    <style>
      .sky { fill:#0b1016 }
      .star { fill:#dfe9f2; opacity:.5 }
      .hull { fill:none; stroke:#dfe9f2; stroke-width:2.2; stroke-linejoin:round }
      .panel { fill:none; stroke:#dfe9f2; stroke-width:1; opacity:.4 }
      .acc  { fill:none; stroke:#ff8373; stroke-width:1.6 }
      .accf { fill:#ff8373 }
      .warm { fill:#ffd98a }
      .note { fill:#8aa0b8; font: 11px monospace }
    </style>
  </defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="60" cy="50" r="1.2"/><circle class="star" cx="505" cy="72" r="1"/><circle class="star" cx="486" cy="226" r="1.3"/><circle class="star" cx="70" cy="250" r="1"/><circle class="star" cx="300" cy="36" r="1"/><circle class="star" cx="180" cy="262" r="1.1"/><circle class="star" cx="524" cy="150" r="1"/>

  <g transform="translate(40 76) scale(2.2)">
    <!-- 尾焰（双引擎，锚点 x26/40） -->
    <path class="warm" d="M30 47 L16 49.5 L30 52 Z" opacity=".9"/>
    <path class="warm" d="M30 63 L16 65.5 L30 68 Z" opacity=".9"/>
    <!-- 长扁平主舰体（驱逐：低趴长身） -->
    <path class="hull" d="M212 56 L168 41 L104 41 C76 41 60 45 50 51 L44 56 L50 61 C60 67 76 71 104 71 L156 71 Z"/>
    <!-- 舰首鼻锥 -->
    <path class="hull" d="M212 56 L226 52 L226 60 L212 56 Z" opacity=".75"/>
    <!-- 上后掠尾翼 -->
    <path class="hull" d="M104 41 L132 20 L142 20 L122 41"/>
    <!-- 下尾翼（镜像） -->
    <path class="hull" d="M104 71 L132 92 L142 92 L122 71"/>
    <!-- 双引擎短舱（上/下） -->
    <path class="hull" d="M54 44 h8 v24 h-8 z M62 44 h8 v24 h-8 z" opacity=".8"/>
    <path class="warm" d="M44 47 h8 v6 h-8 z M44 61 h8 v6 h-8 z"/>
    <!-- 甲板主炮 ×2（中/后脊炮塔 + 炮管朝右） -->
    <path class="hull" d="M138 42 h12 v8 h-12 z"/>
    <path class="hull" d="M150 42 L176 42" stroke-width="2.6"/>
    <path class="acc"  d="M176 42 L180 42"/>
    <path class="hull" d="M92 43 h10 v7 h-10 z"/>
    <path class="hull" d="M102 43 L122 44" stroke-width="2.2"/>
    <!-- 侧舷小炮位 -->
    <path class="hull" d="M158 62 h8 v4 h-8 z M164 62 v7"/>
    <path class="hull" d="M112 63 h6 v4 h-6 z M116 63 v6"/>
    <!-- 舰桥窗列 -->
    <path class="panel" d="M146 47 h16 v7 h-16 z M148 48.5 h12 M148 52 h12"/>
    <!-- 船身面板线 -->
    <path class="panel" d="M80 48 h36 M80 64 h36 M126 44 v24 M104 55 h80"/>
    <!-- 舷灯 -->
    <circle class="accf" cx="98" cy="56" r="1.4"/>
    <circle class="warm" cx="150" cy="66" r="1"/>
  </g>

  <text class="note" x="40" y="286">灰鲭鲨级驱逐舰 · sh-mako · 驱逐 T2 — 样稿 B（低趴长身 + 脊炮 ×2 + 上下双引擎）</text>
</svg>
