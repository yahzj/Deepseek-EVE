<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 样稿 1/4：鲣鱼级护卫舰（掠食者武装 · 最小战斗舰）
       风格基线：线稿 + 内部面板线 + 色点缀；船头朝右；引擎口在左端（尾焰挂点） -->
  <defs>
    <style>
      .sky { fill:#0b1016 }
      .star { fill:#dfe9f2; opacity:.5 }
      .hull { fill:none; stroke:#dfe9f2; stroke-width:2.2; stroke-linejoin:round }
      .panel { fill:none; stroke:#dfe9f2; stroke-width:1; opacity:.4 }
      .acc  { fill:none; stroke:#ff8373; stroke-width:1.6 }
      .accf { fill:#ff8373 }
      .warm { fill:#ffd98a }
      .note { fill:#8aa0b8; font: 11px monospace }
    </style>
  </defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="46" cy="42" r="1.2"/><circle class="star" cx="512" cy="64" r="1"/><circle class="star" cx="474" cy="214" r="1.3"/><circle class="star" cx="66" cy="246" r="1"/><circle class="star" cx="250" cy="30" r="1"/><circle class="star" cx="330" cy="270" r="1.2"/><circle class="star" cx="130" cy="120" r=".8"/><circle class="star" cx="420" cy="170" r=".8"/>

  <!-- 舰形本地坐标 0..240 × 0..110（与现 ShipSprite 比例一致；画布放大 2.2x 摆放） -->
  <g transform="translate(40 74) scale(2.2)">
    <!-- 尾焰（示意：接入时换 CSS 脉冲动画，锚点 = 左端喷口中心 x28 y55） -->
    <path class="warm" d="M24 52 L14 55 L24 58 Z" opacity=".9"/>
    <!-- 主舰体（箭形：右锐舰首 + 后掠主段） -->
    <path class="hull" d="M204 55 L150 38 L76 38 L44 46 L36 55 L44 64 L76 72 L150 72 Z"/>
    <!-- 上后掠翼 -->
    <path class="hull" d="M98 38 L122 21 L131 21 L108 38"/>
    <!-- 下后掠翼（镜像） -->
    <path class="hull" d="M98 72 L122 89 L131 89 L108 72"/>
    <!-- 翼梁面板线 -->
    <path class="panel" d="M104 38 L122 27 M104 72 L122 83"/>
    <!-- 机头下挂主炮 -->
    <path class="hull" d="M200 55 L224 58 L224 63 L200 66"/>
    <path class="accf" d="M224 57.5 L230 60.5 L224 63.5 Z"/>
    <!-- 引擎口 -->
    <path class="hull" d="M42 50 h10 v10 h-10 z M42 52.5 h10 M42 57.5 h10"/>
    <path class="warm" d="M30 51.6 h8 v6.8 h-8 z"/>
    <!-- 舰桥小窗 -->
    <path class="panel" d="M160 49 h18 v8 h-18 z M164 50.5 v5 M170 50.5 v5 M176 50.5 v5"/>
    <!-- 船身面板线 -->
    <path class="panel" d="M92 44 h40 M92 66 h40 M150 46 v18"/>
    <!-- 舷灯 -->
    <circle class="accf" cx="86" cy="55" r="1.4"/>
  </g>

  <text class="note" x="40" y="286">鲣鱼级护卫舰 · sh-falconet · 护卫 T1 — 样稿 A（箭头机身 + 后掠双翼 + 机头炮）</text>
</svg>
