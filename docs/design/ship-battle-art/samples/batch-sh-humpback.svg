<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <!-- 鲸盟采矿族 4a-5/6：座头鲸级矿舰(T3:前驼背拱 + 多钻臂 + 大料斗 = 大型矿舰) -->
  <defs><style>
    .sky { fill:#0b1016 }.star { fill:#dfe9f2; opacity:.5 }
    .hull { fill:none; stroke:#dfe9f2; stroke-width:2.2; stroke-linejoin:round }
    .panel { fill:none; stroke:#dfe9f2; stroke-width:1; opacity:.4 }
    .acc  { fill:none; stroke:#5ee6c8; stroke-width:1.6 }
    .accf { fill:#5ee6c8 }.warm { fill:#ffd98a }
    .note { fill:#8aa0b8; font: 11px monospace }
  </style></defs>
  <rect class="sky" width="560" height="300" rx="14"/>
  <circle class="star" cx="48" cy="46" r="1.2"/><circle class="star" cx="514" cy="64" r="1"/><circle class="star" cx="476" cy="238" r="1.2"/><circle class="star" cx="64" cy="252" r="1"/>
  <g transform="translate(40 74) scale(2.2)">
    <path class="warm" d="M36 55 L26 58 L36 61 Z" opacity=".9"/>
    <!-- 大型矿舰长体 -->
    <path class="hull" d="M206 56 C200 40 168 32 126 32 C96 32 76 40 66 50 L58 56 L64 66 C78 76 102 80 132 80 L190 76 Z"/>
    <!-- 前驼背拱（座头鲸特征:前甲板高拱 + 胸鳍状斜板） -->
    <path class="hull" d="M158 32 C156 18 168 14 180 16 C190 18 196 26 200 36"/>
    <path class="hull" d="M128 44 L144 30 L152 30 L140 44"/>
    <!-- 多钻臂 ×3（前部下探） -->
    <path class="hull" d="M204 48 h18 M204 56 h22 M204 64 h18" stroke-width="2"/>
    <circle class="accf" cx="226" cy="48" r="1.8"/>
    <circle class="accf" cx="226" cy="56" r="2.1"/>
    <circle class="accf" cx="226" cy="64" r="1.8"/>
    <!-- 顶塔 -->
    <path class="hull" d="M112 32 h13 v9 h-13 z"/>
    <!-- 舱盖分舱 -->
    <path class="panel" d="M96 48 h24 M96 60 h24 M126 44 v32 M152 40 v34"/>
    <!-- 尾鳍 -->
    <path class="hull" d="M72 74 l8 13 h-13 z" opacity=".7"/>
    <!-- 双引擎 -->
    <path class="hull" d="M62 44 h9 v13 h-9 z M62 61 h9 v13 h-9 z" opacity=".85"/>
    <path class="warm" d="M52 47 h8 v7 h-8 z M52 64 h8 v7 h-8 z"/>
    <circle class="accf" cx="146" cy="80" r="1.6"/>
  </g>
  <text class="note" x="40" y="286">座头鲸级矿舰 · sh-humpback · 巡洋 T3·采矿型 — 草稿(前驼背拱 + 多钻臂 + 胸鳍斜板)</text>
</svg>
